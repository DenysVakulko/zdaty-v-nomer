<html lang="uk">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Здати в номер</title>
<meta name="description" content="Інтерактивна історія про громадські організації, у якій ви журналіст.">
<style>

}
@media (prefers-color-scheme: dark){

    --bg:#16140f; --paper:#221f19; --ink:#f1ece4; --muted:#b4ab9e; --line:#3a352c;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:18px/1.6 Georgia,"Times New Roman",serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:12px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 10px;border-bottom:2px solid var(--ink);margin-bottom:16px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.brand{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px;white-space:nowrap}
.brand span{color:var(--accent)}
.meta{font-size:13px;color:var(--muted);text-align:right}
h1{font-size:32px;line-height:1.15;margin:8px 0 12px}
h2{font-size:24px;line-height:1.25;margin:4px 0 12px}
h3{font:800 17px/1.3 system-ui,sans-serif;margin:22px 0 8px}
.kicker{font:700 13px/1.4 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:8px}
p{margin:0 0 14px}
a{color:var(--accent)}
.src{font:14px/1.5 system-ui,sans-serif;color:var(--muted)}
.scene{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.loc{position:relative;border-radius:14px;overflow:hidden;margin:0 0 14px;border:1px solid var(--line);animation:locin .7s ease both}
@keyframes locin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.loc svg{display:block;width:100%;height:auto}
.loc .cap{position:absolute;left:10px;bottom:10px;background:rgba(20,18,14,.78);color:#fff;font:600 13px/1.3 system-ui,sans-serif;padding:6px 10px;border-radius:8px;max-width:90%}
.loc .cap small{display:block;font-weight:400;opacity:.8}
.chat{display:flex;flex-direction:column;gap:10px;margin:8px 0 6px}
.msg{display:flex;gap:10px;align-items:flex-end;animation:pop .28s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg .av{flex:0 0 44px;width:44px;height:44px}
.msg .av svg{width:44px;height:44px;display:block}
.bubble{background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:9px 13px;max-width:82%;font-size:17px;line-height:1.5}
.bubble .who{display:block;font:700 13px/1.35 system-ui,sans-serif;margin-bottom:2px}
.bubble .who em{font-style:normal;font-weight:500;color:var(--muted)}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--me);color:var(--me-ink);border-color:var(--me);border-radius:16px 16px 4px 16px;font-family:system-ui,sans-serif;font-size:16px}
.sys{align-self:center;font:13px/1.4 system-ui,sans-serif;color:var(--muted);background:var(--chip);border-radius:999px;padding:4px 12px;text-align:center;max-width:92%;animation:pop .28s ease both}
.typing .bubble{padding:12px 14px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.tag{display:inline-block;font:600 11px/1.6 system-ui,sans-serif;background:var(--chip);color:var(--muted);border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:middle}
.tag.real{background:var(--accent);color:var(--accent-ink)}
.skip{all:unset;cursor:pointer;display:block;margin:6px auto 0;font:600 13px/1 system-ui,sans-serif;color:var(--muted);padding:8px 12px;border:1px dashed var(--line);border-radius:999px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card .speaker{font:700 15px/1.4 system-ui,sans-serif;margin-bottom:6px}
.doc{font-family:"Courier New",monospace;font-size:14px;line-height:1.5;background:var(--paper);border:1px dashed var(--muted);padding:14px 16px;border-radius:8px;white-space:pre-wrap;overflow-x:auto;animation:pop .28s ease both}
.quote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:12px 0;font-style:italic}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px;animation:enter .35s ease both}
button.choice{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:13px 16px;font:600 16px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink);transition:transform .12s ease, background .12s ease}
button.choice:hover{background:var(--chip)}
button.choice:active{transform:scale(.985)}
button.choice:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.choice.primary{background:var(--ink);color:var(--bg)}

button.choice.mark[aria-pressed="true"]{background:var(--note);border:2px solid var(--accent)}

.timebar i{display:block;width:22px;height:8px;border-radius:4px;background:var(--ink)}
.timebar i.used{background:var(--line)}
.feedback{border-radius:12px;padding:12px 14px;margin:12px 0;font:15px/1.55 system-ui,sans-serif;animation:pop .28s ease both}
.feedback.ok{border:2px solid var(--good)}
.feedback.no{border:2px solid var(--bad)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);font-family:system-ui,sans-serif;z-index:5}
.bottom .in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn-s{all:unset;cursor:pointer;font:600 15px/1 system-ui,sans-serif;padding:10px 14px;border:1px solid var(--ink);border-radius:8px}
.btn-s:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-s .badge{display:inline-block;min-width:20px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:12px;padding:2px 6px;margin-left:6px}
.btn-s.flash{animation:flash .9s ease}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10}
.drawer.open{display:block}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--note);border-left:1px solid var(--note-line);padding:20px 18px;overflow:auto;animation:slide .3s ease both}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.drawer h3{margin:0 0 12px}
.drawer ul{padding-left:20px;margin:0}
.drawer li{margin-bottom:10px;font-size:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:800 24px/1.2 system-ui,sans-serif}
.stat span{font:14px/1.3 system-ui,sans-serif;color:var(--muted)}
.disclaimer{font:14px/1.55 system-ui,sans-serif;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:20px}
.cast{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.cast svg{width:46px;height:46px}
.post{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 0 12px}
.post .ch{font:700 13px system-ui,sans-serif;color:var(--muted);margin-bottom:6px}
.post .hd{font:800 19px/1.3 system-ui,sans-serif}
.post .re{font:13px system-ui,sans-serif;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1{font-size:27px}body{font-size:17px}.bubble{font-size:16px}}
.msg.cont{margin-top:-6px}
.msg.cont .av{visibility:hidden}
</style>
</head>

/* Заголовки опублікованих матеріалів */
function headline1(s){ return {explain:`Як група друзів стає громадською організацією і що це змінює`, sensation:`Молодь заснувала ГО. Заради чого?`, promo:`Звідки береться громадська організація: історія «Перехрестя»`}[s.flags.h1] || `Хто такі «Перехрестя»`; }
function headline2(s){ return {inside:`Хто вирішує в ГО і чому люди звідти йдуть`, quarrel:`Сварка в «Перехресті»: команда на межі розколу`, burnout:`Скільки коштує безоплатна робота`, evening:`Один вечір у «Перехресті»`}[s.flags.h2] || `Один вечір у «Перехресті»`; }
function headline3(s){ return {errors:`Три помилки, через які фонди відмовляють молодіжним ГО`, next:`Фонд відмовив молоді. Що далі?`, leak:`Конкурс із сюрпризом: що приховує комісія`}[s.flags.h3] || `Фонд відмовив молоді. Що далі?`; }
function headline4(s){ return {fair:`Сто днів: 6 заходів із 8 і простір, який працює далі`, fail:`Гроші громади на вітер?`, promo:`Свято, яке подарувала молодь`, neutral:`Як молодіжна ГО прожила свій перший проєкт`}[s.flags.h4] || `Як молодіжна ГО прожила свій перший проєкт`; }

/* Фінали: умови перевіряються згори донизу. */
function ending(s){
  if (s.ind <= -2 || s.trust <= -2) return {
    title:`Серію знято`,
    editor:`Я не можу тримати на сайті серію, у якій героїня правила текст, поїздку оплатили герої, а джерела кажуть, що їх записували потай. Ми знімаємо матеріали і пишемо пояснення читачам.`,
    epilogue:`Джерела в громаді перестали говорити з «Ліскова.Медіа». «Перехрестя» працює, але про нього тепер пишуть лише в їхньому власному телеграм-каналі.` };
  if (s.acc <= 2) return {
    title:`Гучно, але з помилками`,
    editor:`Перегляди хороші. Але нам довелося публікувати виправлення. Гучність без точності в нашій професії швидко закінчується.`,
    epilogue:`Чутки про «Перехрестя» досі ходять містом. Організація втратила одного партнера, хоча нічого не порушила.` };
  if (s.bal <= 2) return {
    title:`Точно, але в один бік`,
    editor:`Факти захищені, до них не причепишся. Але скептиків і самих героїв у тексті чути погано, і половина міста вирішила, що серія замовна.`,
    epilogue:`«Перехрестя» працює, а суперечки в коментарях так і не вщухли: кожна сторона читає в серії своє.` };
  if (s.acc >= 9 && s.bal >= 6 && s.ind >= 1 && s.trust >= 1) return {
    title:`Серія, яку цитують`,
    editor:`Це найкраща робота стажера за останні роки. Подаємо серію на регіональний конкурс журналістських робіт. І так, ти в штаті.`,
    epilogue:`Простір у колишній бібліотеці відкрито щодня. Дві інші ініціативи з громади зареєстрували власні ГО і посилаються на ваш розбір заявки, коли пишуть свої.` };
  return {
    title:`Чесна робота`,
    editor:`Солідна серія. Є місця, де можна було копнути глибше, але читач отримав факти й різні погляди. Беру тебе в штат.`,
    epilogue:`«Перехрестя» подає вже другу заявку до фонду «Обрій». Цього разу з першої спроби.` };
}

  if (a.style==='long') { back = `<path d="M17 27 C16 9 48 9 47 27 L49 52 L15 52Z" fill="${hair}"/>`; front = cap; }
  if (a.style==='short') front = cap;
  if (a.style==='bun') front = cap + `<circle cx="32" cy="11" r="6" fill="${hair}"/>`;
  if (a.style==='bob') { back = `<path d="M17 27 C16 9 48 9 47 27 L47 41 L17 41Z" fill="${hair}"/>`; front = `<path d="M19 27 C18 12 46 12 45 27 C40 22 30 22 19 27Z" fill="${hair}"/>`; }

  const must = a.mustache ? `<path d="M26.5 34.5 Q32 31 37.5 34.5 Q32 35.8 26.5 34.5Z" fill="${hair}"/>` : '';
  const gl = a.glasses ? `<g fill="none" stroke="#2b2b2b" stroke-width="1.4"><circle cx="27" cy="28.5" r="4.3"/><circle cx="37" cy="28.5" r="4.3"/><path d="M31.3 28.5 H32.7"/></g>` : '';

  <path d="M28 35.5 Q32 38.5 36 35.5" fill="none" stroke="#7a3b2e" stroke-width="1.4" stroke-linecap="round"/>

}

}

   РУШІЙ ГРИ. Нижче код, який правити не потрібно.
   ===================================================================== */
const KEY = 'zdaty-v-nomer-v2';
const fresh = () => ({ scene:'start', acc:0, bal:0, trust:0, ind:0, time:6, notes:[], done:[], flags:{}, seen:{} });
let S = load() || fresh();
let playToken = 0;
const app = document.getElementById('app');
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function load(){ try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function has(s,k){ return s.notes.includes(k); }
function addNote(s,k){ if(!s.notes.includes(k)){ s.notes.push(k); flashNotes(); } }
function dropNote(s,k){ s.notes = s.notes.filter(x=>x!==k); }
function fmt(n){ return (n>0?'+':'')+n; }
function flashNotes(){ const b=document.getElementById('notesBtn'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }

function bubble(who, text, prev){
  const cont = prev===who;
  if (who==='me') return `<div class="msg me"><div class="bubble">${text}</div></div>`;
  if (who==='sys') return `<div class="sys">${text}</div>`;
  if (who==='doc') return `<div class="doc">${text}</div>`;
  if (who.startsWith('r:')) { const n = who.slice(2); return `<div class="msg${cont?' cont':''}"><div class="av">${readerAv(n)}</div><div class="bubble">${cont?'':`<span class="who">${n} <em>· читач</em></span>`}${text}</div></div>`; }
  const c = CAST[who];
  return `<div class="msg${cont?' cont':''}"><div class="av">${face(c.av)}</div><div class="bubble">${cont?'':`<span class="who">${c.name}${c.role?` <em>· ${c.role}</em>`:''} <span class="tag">умовний персонаж</span></span>`}${text}</div></div>`;
}
function typingRow(who, prev){
  if (who==='me' || who==='sys' || who==='doc') return '';
  const cont = prev===who;
  const av = who.startsWith('r:') ? readerAv(who.slice(2)) : face(CAST[who].av);
  return `<div class="msg typing${cont?' cont':''}"><div class="av">${av}</div><div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div></div>`;
}
function post(title, views){
  return `<div class="post"><div class="ch">Ліскова.Медіа · канал</div><div class="hd">${title}</div><div class="re">👁 ${Math.max(300,views)} переглядів · коментарі нижче</div></div>`;
}

function go(id){
  if (id==='restart'){ S = fresh(); save(); render(); window.scrollTo(0,0); return; }
  S.scene = id;
  const sc = SCENES[id];
  if (sc && sc.onEnter && !S.seen[id]) sc.onEnter(S);
  save(); render(); window.scrollTo(0,0);
}

function render(){
  const token = ++playToken;
  const sc = SCENES[S.scene];
  document.getElementById('meta').textContent = CH[sc.ch] || '';
  document.getElementById('nb').textContent = S.notes.length;
  let h = `<div class="scene">`;
  if (sc.loc) h += `<div class="loc">${scenery(sc.loc)}<div class="cap">${sc.place||''}${sc.when?`<small>${sc.when}</small>`:''}</div></div>`;
  if (sc.kicker) h += `<div class="kicker">${sc.kicker}</div>`;
  if (sc.hub) h += hubHead();
  if (sc.html) h += (typeof sc.html==='function' ? sc.html(S) : sc.html);
  h += `<div class="chat" id="chat"></div><div id="after"></div></div>`;
  app.innerHTML = h;

  if (sc.markup) return renderMarkup(sc);
  const msgs = sc.chat ? (typeof sc.chat==='function' ? sc.chat(S) : sc.chat) : [];
  const chat = document.getElementById('chat');
  const finish = () => { if (token!==playToken) return; S.seen[S.scene]=true; save(); showChoices(sc); };
  if (!msgs.length) return finish();
  if (S.seen[S.scene] || reduce){ chat.innerHTML = msgs.map((m,j)=>bubble(m[0],m[1],j?msgs[j-1][0]:null)).join(''); return finish(); }

  const skip = document.createElement('button'); skip.className='skip'; skip.type='button'; skip.textContent='Показати все одразу';
  let i = 0, skipped = false;
  skip.onclick = () => { skipped = true; chat.innerHTML = msgs.map((m,j)=>bubble(m[0],m[1],j?msgs[j-1][0]:null)).join(''); skip.remove(); finish(); };
  document.getElementById('after').appendChild(skip);
  const step = () => {
    if (token!==playToken || skipped) return;
    if (i >= msgs.length){ skip.remove(); return finish(); }
    const m = msgs[i];
    const prev = i ? msgs[i-1][0] : null;
    const t = typingRow(m[0], prev);
    const delay = m[0]==='sys' ? 450 : m[0]==='doc' ? 650 : m[0]==='me' ? 550 : Math.min(1600, 450 + m[1].length*11);
    if (t) chat.insertAdjacentHTML('beforeend', t);
    setTimeout(() => {
      if (token!==playToken || skipped) return;
      const ty = chat.querySelector('.typing'); if (ty) ty.remove();
      chat.insertAdjacentHTML('beforeend', bubble(m[0], m[1], prev));
      const last = chat.lastElementChild;
      if (last && last.getBoundingClientRect().bottom > window.innerHeight - 90) last.scrollIntoView({behavior:'smooth', block:'end'});
      i++; setTimeout(step, 220);
    }, delay);
  };
  step();
}

function hubHead(){
  return `<div class="timebar" aria-label="Залишилося годин: ${S.time}">${Array.from({length:6},(_,i)=>`<i class="${i < S.time ? '' : 'used'}"></i>`).join('')}<span>${S.time>0?`залишилося ${S.time} год`:`час вийшов`}</span></div>
  <h2>${S.time>0 ? 'Що робимо?' : 'Пора писати'}</h2>`;
}

function showChoices(sc){
  const ch = (sc.choices||[]).filter(c => !(c.cond && !c.cond(S)) && !(c.once && S.done.includes(c.once)));
  const box = document.createElement('div'); box.className='choices';
  ch.forEach(c => {
    if (c.cost && c.cost > S.time) return;
    const b = document.createElement('button'); b.type='button'; b.className = 'choice' + (c.primary?' primary':'');
    b.innerHTML = c.text + (c.cost?`<span class="cost">${c.cost} год</span>`:'');
    b.onclick = () => { if (c.cost) S.time -= c.cost; if (c.once) S.done.push(c.once); if (c.effect) c.effect(S); go(c.to); };
    box.appendChild(b);
  });
  document.getElementById('after').appendChild(box);
}

function renderMarkup(sc){
  const m = sc.markup;
  const after = document.getElementById('after');
  if (S.flags.markHit !== undefined){
    after.innerHTML = `<div class="feedback ${S.flags.markHit>=3 && !S.flags.markMiss?'ok':'no'}">Ви влучили в ${S.flags.markHit} з 4 слабких місць${S.flags.markMiss?` і позначили ${S.flags.markMiss} зайвих`:''}. ${S.flags.markHit>=3 && !S.flags.markMiss ? 'Добрий розбір.' : 'Варто показати заявку експертові.'}</div>`;
    S.seen[S.scene] = true; save();
    const b = document.createElement('div'); b.className='choices'; b.innerHTML = `<button type="button" class="choice primary">Повернутися до плану</button>`;
    b.firstChild.onclick = () => go(sc.next); after.appendChild(b); return;
  }
  const sel = new Set();
  after.innerHTML = `<h2>Розбір заявки</h2><p>${m.intro(S)}</p><div class="choices" id="mk">${m.lines.map((l,i)=>`<button type="button" class="choice mark" aria-pressed="false" data-i="${i}">${l.t}</button>`).join('')}</div>
  <div class="choices"><button type="button" class="choice primary" id="mkDone">Готово</button></div>`;
  after.querySelectorAll('#mk button').forEach(b => b.onclick = () => { const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i); b.setAttribute('aria-pressed', sel.has(i)); });
  document.getElementById('mkDone').onclick = () => {
    let hit=0, miss=0; m.lines.forEach((l,i)=>{ if(sel.has(i)){ l.bad?hit++:miss++; } });
    S.flags.markHit=hit; S.flags.markMiss=miss;
    S.acc += (hit>=3 && !miss ? 1 : 0) - (miss>0 ? 1 : 0);
    addNote(S,'c3_found'); save(); render();
  };
}

/* Блокнот */
const drawer = document.getElementById('drawer');
document.getElementById('notesBtn').addEventListener('click', () => {
  document.getElementById('notesList').innerHTML = S.notes.length
    ? `<ul>${S.notes.slice().reverse().map(k=>`<li>${NOTES[k]}</li>`).join('')}</ul>` : `<p>Поки порожньо.</p>`;
  drawer.classList.add('open'); document.getElementById('closeNotes').focus();
});
document.getElementById('closeNotes').addEventListener('click', () => drawer.classList.remove('open'));
drawer.addEventListener('click', e => { if (e.target === drawer) drawer.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer.classList.remove('open'); });
document.getElementById('restartBtn').addEventListener('click', () => go('restart'));

render();
</script>
</body>
